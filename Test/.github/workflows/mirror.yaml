name: Mirror

on: push

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Set Git configuration for automation
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Clone central repository
        env:
          TOKEN: ${{ secrets.MIRRORING }}
        run: |
          git clone "https://${TOKEN}@github.com/ViltardLeo/Test-Mirror.git" mirror

      - name: Pull/Add subtree for actual repository
        working-directory: mirror
        env:
          TOKEN: ${{ secrets.MIRRORING }}
        run: |
          if [ -d "${GITHUB_REPOSITORY#*/}" ]; then
            git subtree pull --prefix=Test "https://${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main --squash
          else
            git subtree add --prefix=Test "https://${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main --squash
          fi

      - name: Push to central repository
        working-directory: mirror
        env:
          TOKEN: ${{ secrets.MIRRORING }}
        run: |
          git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"
          git push origin main
